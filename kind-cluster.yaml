kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
networking:
  # Without this, kind binds the API server to a random free host port on
  # every `kind create cluster` — meaning every respin silently breaks any
  # already-running process (the triage bridge, kubectl in another shell,
  # etc.) still pointed at the old port, until `kind export kubeconfig` is
  # re-run. Pinning it means the port never changes across respins.
  apiServerPort: 6443
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80      # Ingress controller listens here
        hostPort: 80           # Windows localhost:80
        protocol: TCP
      - containerPort: 443
        hostPort: 8443     # 443 is taken on the Windows host (IP Helper / DirectAccess)
        protocol: TCP
      - containerPort: 30000   # Your NodePort API service
        hostPort: 30000
        protocol: TCP
      - containerPort: 32000
        hostPort: 32000
  - role: worker
  - role: worker