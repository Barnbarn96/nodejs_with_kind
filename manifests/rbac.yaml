apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-user
  namespace: kind-demo
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: read-role
  namespace: kind-demo
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: read-bind
  namespace: kind-demo
subjects:
  - kind: ServiceAccount
    name: api-user
    namespace: kind-demo
roleRef:
  kind: Role
  name: read-role
  apiGroup: rbac.authorization.k8s.io