server:
  persistentVolume:
    enabled: true
    size: 2Gi
    storageClass: standard
  extraArgs:
    enable-feature: "true"

alertmanager:
  persistentVolume:
    enabled: true
    size: 1Gi
    storageClass: standard

  config:
    global:
      resolve_timeout: 5m
    
    route:
      receiver: 'discord-default'
      # Group per pod, not just per alertname: with the default ['alertname']
      # every crashlooping pod in the cluster collapses into ONE notification,
      # and the bridge would only ever see the first pod's labels.
      group_by: ['alertname', 'namespace', 'pod']
      group_wait: 10s
      group_interval: 10s
      repeat_interval: 12h
      routes:
        # Must come FIRST — routes are first-match-wins, and the severity
        # routes below would otherwise swallow these before the bridge sees them.
        # Add `continue: true` here if you also want the raw alert in Discord.
        - match_re:
            alertname: 'Pod(CrashLooping|ImagePullFailing|NotReady|OOMKilled|Unschedulable)'
          receiver: 'triage-bridge'
        # PodRestartingRepeatedly exists only to give inhibit_rules a stable
        # signal (see below) — it's not meant to be seen, so it's swallowed
        # here rather than reaching Discord a second time.
        - match:
            alertname: 'PodRestartingRepeatedly'
          receiver: 'noop'
        - match:
            severity: warning
          receiver: 'discord-warnings'
        - match:
            severity: critical
          receiver: 'discord-critical'

    # Suppress the generic NotReady alert once a more specific root-cause
    # alert is already firing for the same pod — otherwise a crashlooping
    # pod fires PodCrashLooping immediately and PodNotReady 5m later for the
    # same underlying failure, doubling both Discord noise and triage runs
    # (the bridge's TRIAGE_DEDUP_TTL_S only prevents re-triaging the exact
    # same alert, not a second, different alert on the same pod).
    #
    # PodCrashLooping/PodOOMKilled/PodImagePullFailing alone aren't reliable
    # inhibit sources: their expressions read instantaneous `reason` gauges
    # (waiting_reason, last_terminated_reason) that can go quiet as a
    # container cycles Running -> OOMKilled -> Waiting during a backoff
    # storm, so the "source" alert can resolve well before PodNotReady's 5m
    # `for` elapses — observed live: a pod stuck OOMKilling every ~10s still
    # reached Discord as "(alert: PodNotReady)" because PodOOMKilled had
    # already resolved by the 5-minute mark. PodRestartingRepeatedly instead
    # tracks restart *count* over a 10m window, which stays true for the
    # whole storm regardless of which instantaneous state each scrape catches.
    inhibit_rules:
      - source_match:
          alertname: 'PodCrashLooping'
        target_match:
          alertname: 'PodNotReady'
        equal: ['namespace', 'pod']
      - source_match:
          alertname: 'PodImagePullFailing'
        target_match:
          alertname: 'PodNotReady'
        equal: ['namespace', 'pod']
      - source_match:
          alertname: 'PodOOMKilled'
        target_match:
          alertname: 'PodNotReady'
        equal: ['namespace', 'pod']
      - source_match:
          alertname: 'PodRestartingRepeatedly'
        target_match:
          alertname: 'PodNotReady'
        equal: ['namespace', 'pod']
    
    receivers:
      - name: 'discord-default'
        discord_configs:
          - webhook_url: 'DISCORD_WEBHOOK_URL_PLACEHOLDER'
            send_resolved: true
            title: '{{ .GroupLabels.alertname }}'
            message: |-
              {{ range .Alerts }}
              **Summary:** {{ .Annotations.summary }}
              **Description:** {{ .Annotations.description }}
              **Severity:** {{ .Labels.severity }}
              {{ end }}
      
      - name: 'discord-warnings'
        discord_configs:
          - webhook_url: 'DISCORD_WEBHOOK_URL_PLACEHOLDER'
            send_resolved: true
            title: '⚠️ Warning: {{ .GroupLabels.alertname }}'
            message: |-
              {{ range .Alerts }}
              **{{ .Annotations.summary }}**
              {{ .Annotations.description }}
              {{ end }}
      
      - name: 'discord-critical'
        discord_configs:
          - webhook_url: 'DISCORD_WEBHOOK_URL_PLACEHOLDER'
            send_resolved: true
            title: '🚨 Critical: {{ .GroupLabels.alertname }}'
            message: |-
              {{ range .Alerts }}
              **{{ .Annotations.summary }}**
              {{ .Annotations.description }}
              {{ end }}

      # k8s-triage-agent bridge: auto-diagnoses the pod and posts the root
      # cause to Discord itself, so this receiver needs no webhook_url.
      #   host.docker.internal = the host from inside a Docker Desktop container.
      #   The bridge answers immediately and triages in the background, because
      #   Alertmanager times out a webhook well before a diagnosis finishes.
      - name: 'triage-bridge'
        webhook_configs:
          - url: 'http://host.docker.internal:8080/alert'
            send_resolved: false

      # No configs — deliberately swallows PodRestartingRepeatedly, which
      # exists only to drive inhibit_rules, not to be seen in Discord.
      - name: 'noop'



# Add your custom scrape config without overriding defaults
extraScrapeConfigs: |
  - job_name: "kind-api"
    metrics_path: /metrics
    static_configs:
      - targets:
          - api.kind-demo.svc.cluster.local:80

serverFiles:
  alerting_rules.yml:
    groups:
      - name: api-alerts
        rules:
          # http_errors_total is a monotonic counter — `sum(...) > 0` would
          # latch permanently true after the first error ever recorded.
          # rate() over a window gives "errors happening now", which is what
          # an alert actually needs to mean.
          - alert: HTTPErrorsPresent
            expr: sum(rate(http_errors_total[5m])) > 0
            for: 30s
            labels:
              severity: warning
            annotations:
              summary: "HTTP errors detected"
              description: "Error rate: {{ $value | printf \"%.3f\" }}/s over the last 5m"

          # Manual Discord-wiring smoke test — always fires, so it must stay
          # commented out except when verifying a new webhook end-to-end.
          # - alert: TestAlert
          #   expr: vector(1)
          #   labels:
          #     severity: warning
          #   annotations:
          #     summary: "🧪 Test Alert"
          #     description: "This is a test alert to verify Discord integration"

      # Pod-health alerts for the k8s-triage-agent bridge. These come from
      # kube-state-metrics and carry `namespace` and `pod` labels — the bridge
      # reads those to know what to diagnose, so an alert without them (like
      # TestAlert above) is silently skipped.
      - name: pod-health
        rules:
          - alert: PodCrashLooping
            expr: kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"} > 0
            for: 30s
            labels:
              severity: critical
            annotations:
              summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is crash-looping"
              description: "Container {{ $labels.container }} is in CrashLoopBackOff."

          - alert: PodImagePullFailing
            expr: kube_pod_container_status_waiting_reason{reason=~"ImagePullBackOff|ErrImagePull"} > 0
            for: 30s
            labels:
              severity: critical
            annotations:
              summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} cannot pull its image"
              description: "Container {{ $labels.container }} is stuck pulling its image."

          - alert: PodNotReady
            # Excludes pods that are merely starting, and Job pods that have
            # legitimately finished (Succeeded/Failed are never "ready").
            expr: |
              kube_pod_status_ready{condition="true"} == 0
              unless on(namespace, pod) kube_pod_status_phase{phase=~"Succeeded|Failed"} == 1
            for: 5m
            labels:
              severity: warning
            annotations:
              summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} has been not-ready for 5m"
              description: "Pod is not passing its readiness checks."

          - alert: PodOOMKilled
            expr: kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1
            for: 30s
            labels:
              severity: critical
            annotations:
              summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} was OOMKilled"
              description: "Container {{ $labels.container }} was killed for exceeding its memory limit."

          - alert: PodUnschedulable
            # A pod stuck Pending past scheduling time — requests too large
            # for any node, no matching taints/tolerations, etc.
            expr: kube_pod_status_phase{phase="Pending"} == 1
            for: 2m
            labels:
              severity: critical
            annotations:
              summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is stuck Pending"
              description: "Pod has not been scheduled for over 2m."

          - alert: PodRestartingRepeatedly
            # Inhibit-only signal (see the `inhibit_rules` comment above) —
            # restart *count* over a window, unlike the reason gauges, stays
            # true for the whole backoff storm instead of flickering with it.
            expr: increase(kube_pod_container_status_restarts_total[10m]) > 2
            for: 30s
            labels:
              severity: critical
            annotations:
              summary: "Pod {{ $labels.namespace }}/{{ $labels.pod }} is restarting repeatedly"
              description: "Container {{ $labels.container }} has restarted more than twice in the last 10m."


alerting:
  alertmanagers:
  - static_configs:
    - targets: ['prom-alertmanager:9093']
            
configmapReload:
  prometheus:
    enabled: true
  alertmanager:
    enabled: true


