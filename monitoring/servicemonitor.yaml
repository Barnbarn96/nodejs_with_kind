apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kind-api
  namespace: monitoring
  labels:
    release: kube-prom-stack
spec:
  namespaceSelector:
    matchNames: ["kind-demo"]
  selector:
    matchLabels:
      app: api
  endpoints:
    - port: http
      path: /metrics
