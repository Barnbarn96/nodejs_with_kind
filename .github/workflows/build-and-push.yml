name: Build and push image

on:
  push:
    branches: [release]
    paths:
      - Dockerfile
      - src/**
      - package.json
      - package-lock.json
  # Lets the first image be built on demand (Actions tab → this workflow →
  # Run workflow) without needing an unrelated code change to satisfy the
  # paths filter above.
  workflow_dispatch: {}

env:
  # Hardcoded lowercase, not ${{ github.repository_owner }} — Docker image
  # paths must be lowercase, but that expression resolves to the
  # account's actual casing ("Barnbarn96"), which would break the push.
  IMAGE: ghcr.io/barnbarn96/nodejs_with_kind

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest

      - name: Bump the Rollout to the new image tag
        run: |
          sed -i "s|image: ${{ env.IMAGE }}:.*|image: ${{ env.IMAGE }}:${{ github.sha }}|" \
            gitops/apps/kind-api/rollout.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add gitops/apps/kind-api/rollout.yaml
          # Nothing to commit if the tag didn't actually change (re-running
          # the same commit's build, workflow_dispatch replay, etc.) —
          # `git commit` would fail the step for no reason otherwise.
          git diff --cached --quiet && echo "No manifest change, skipping commit." || \
            git commit -m "Deploy ${{ github.sha }} to kind-api [skip ci]"
          git push origin HEAD:release
