name: CI

# Fast checks on every push and pull request, any branch. The image build
# (build-and-push.yml) only runs on `release` and repeats these first.
on:
  push:
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  validate-manifests:
    runs-on: ubuntu-latest
    env:
      KUBECONFORM_VERSION: v0.7.0
    steps:
      - uses: actions/checkout@v4

      - name: Install kubeconform
        run: |
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz -C /usr/local/bin kubeconform

      # Renders every Kustomize app and validates the result plus the plain
      # manifests/monitoring YAML. CRDs (Rollout, AnalysisTemplate,
      # PrometheusRule, ServiceMonitor, AlertmanagerConfig, Application) are
      # checked against the community CRDs-catalog schemas.
      - name: Render and validate
        run: |
          set -euo pipefail
          SCHEMAS=(
            -schema-location default
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
          )
          for dir in gitops/apps/kind-api gitops/apps/demo-app/overlays/dev gitops/apps/demo-app/overlays/prod; do
            echo "== $dir"
            kubectl kustomize "$dir" | kubeconform -strict -summary "${SCHEMAS[@]}" -
          done
          echo "== plain manifests"
          kubeconform -strict -summary "${SCHEMAS[@]}" \
            manifests/namespace.yaml manifests/secret.yaml \
            monitoring/servicemonitor.yaml monitoring/alertmanager-config.yaml \
            monitoring/rules/ gitops/argocd/app-of-apps.yaml
