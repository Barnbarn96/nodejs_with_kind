apiVersion: v1
kind: ServiceAccount
metadata:
  name: api-user
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: read-role
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: read-bind
subjects:
  - kind: ServiceAccount
    name: api-user
roleRef:
  kind: Role
  name: read-role
  apiGroup: rbac.authorization.k8s.io