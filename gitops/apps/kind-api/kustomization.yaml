apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# Everything kind-api needs is GitOps-managed from here. The one exception
# is the Secret (manifests/secret.yaml), which scripts/deploy.sh applies
# directly so credentials aren't part of what ArgoCD syncs from Git.
resources:
  - rbac.yaml
  - configmap.yaml
  - service.yaml
  - ingress.yaml
  - analysis-template.yaml
  - rollout.yaml
  - hpa.yaml
