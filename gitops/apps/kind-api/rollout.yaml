apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: api
  namespace: kind-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: api-user
      containers:
        - name: api
          # Bootstraps against :latest — bump to a specific :<git-sha> tag
          # (pushed by .github/workflows/build-and-push.yml on every push
          # to `release`) to trigger a real canary rollout.
          image: ghcr.io/barnbarn96/nodejs_with_kind:60e9c301fc48b2446b33c51c8b85f8bc9c02b4e5
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /ready
              port: 3000
            initialDelaySeconds: 3
            periodSeconds: 5
          envFrom:
            - configMapRef:
                name: api-config
            - secretRef:
                name: api-secret
          volumeMounts:
            - name: api-storage
              mountPath: /app/data
      volumes:
        - name: api-storage
          persistentVolumeClaim:
            claimName: api-pvc
  strategy:
    canary:
      steps:
        - setWeight: 25
        - pause:
            duration: 30s
        - setWeight: 50
        - pause:
            duration: 30s
        - setWeight: 75
        - pause:
            duration: 30s
