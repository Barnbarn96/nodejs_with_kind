apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: demo-app-dev
resources:
  - ../../base
patches:
  - target:
      kind: Rollout
      name: demo-app
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 2
      - op: replace
        path: /spec/template/spec/containers/0/args/0
        value: "-text=dev-v1"
