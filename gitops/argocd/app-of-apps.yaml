# App-of-apps: this one file is what you point ArgoCD at
# (`kubectl apply -f gitops/argocd/app-of-apps.yaml`, done by run-all.sh),
# and it owns one child Application per environment of kind-api. Each child
# syncs its own Kustomize overlay independently, so dev and prod can
# drift/roll back separately without touching this file again.
#
#   kind-api-dev → gitops/apps/kind-api/overlays/dev  → namespace kind-api-dev
#   kind-api     → gitops/apps/kind-api/overlays/prod → namespace kind-demo
#
# (The prod Application keeps its original name, `kind-api`, so existing
# clusters update it in place instead of ending up with two Applications
# fighting over kind-demo.)
#
# Originally a separate standalone repo (gitops-kind-demo) with a toy
# http-echo app; merged into this repo and since narrowed to the real API.
# See gitops/WRITEUP.md and gitops/PLAN.md for the history.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kind-api-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Barnbarn96/nodejs_with_kind.git
    # HEAD resolves to origin/main on GitHub, which is unrelated, stale
    # content from before this repo's real work began — all real work
    # lives on the `release` branch instead.
    targetRevision: release
    path: gitops/apps/kind-api/overlays/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: kind-api-dev
  # The HPA changes the Rollout's replica count at runtime. Without this,
  # selfHeal would keep resetting it to the value in Git and fight the
  # autoscaler.
  ignoreDifferences:
    - group: argoproj.io
      kind: Rollout
      name: api
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: kind-api
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Barnbarn96/nodejs_with_kind.git
    targetRevision: release
    path: gitops/apps/kind-api/overlays/prod
  destination:
    server: https://kubernetes.default.svc
    namespace: kind-demo
  # See the note on kind-api-dev above.
  ignoreDifferences:
    - group: argoproj.io
      kind: Rollout
      name: api
      jsonPointers:
        - /spec/replicas
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - RespectIgnoreDifferences=true
